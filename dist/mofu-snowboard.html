      this.popup('いたっ！', '#ff8a8a');
      if (this.hearts <= 0) setTimeout(() => { if (this.state === 'run') this.gameOver(); }, 900);
    }

    vibrate(pattern) {
      if (navigator.vibrate && this.ui.haptics) { try { navigator.vibrate(pattern); } catch (e) { /* 無視 */ } }
    }

    flash(a, color) { this.flashA = Math.max(this.flashA, a); this.flashColor = color || '#ffffff'; }

    /* --- パーティクル --------------------------------------------------- */
    spray(n, power) {
      const p = this.p;
      for (let i = 0; i < n; i++) {
        this.particles.push({
          kind: 'snow',
          x: p.x + (Math.random() - 0.5) * 0.8,
          y: Math.random() * 0.3,
          z: p.z - 0.4 + Math.random() * 0.6,
          vx: (Math.random() - 0.5) * 3 * power - p.vx * 0.25,
          vy: 1.2 + Math.random() * 2.4 * power,
          vz: -0.6 - Math.random() * 1.8,
          life: 0.5 + Math.random() * 0.5,
          age: 0,
          r: 0.045 + Math.random() * 0.075,
        });
      }
      if (this.particles.length > 320) this.particles.splice(0, this.particles.length - 320);
    }

    puff(o, n) {
      for (let i = 0; i < (n || 16); i++) {
        this.particles.push({
          kind: 'snow',
          x: o.x + (Math.random() - 0.5) * 1.6,
          y: 0.3 + Math.random() * 1.6,
          z: o.z + (Math.random() - 0.5) * 1.2,
          vx: (Math.random() - 0.5) * 6,
          vy: 1 + Math.random() * 4,
          vz: (Math.random() - 0.5) * 5,
          life: 0.6 + Math.random() * 0.6,
          age: 0,
          r: 0.14 + Math.random() * 0.26,
        });
      }
    }

    sparkle(o) {
      for (let i = 0; i < 8; i++) {
        this.particles.push({
          kind: 'spark',
          x: o.x, y: (o.y || 0.9), z: o.z,
          vx: (Math.random() - 0.5) * 4,
          vy: (Math.random() - 0.3) * 4,
          vz: (Math.random() - 0.5) * 3,
          life: 0.4 + Math.random() * 0.3,
          age: 0,
          r: 0.09,
        });
      }
    }

    updateParticles(dt) {
      const ps = this.particles;
      for (let i = ps.length - 1; i >= 0; i--) {
        const q = ps[i];
        q.age += dt;
        if (q.age >= q.life || q.z < this.cam.z + 1) { ps.splice(i, 1); continue; }
        q.x += q.vx * dt;
        q.y += q.vy * dt;
        q.z += q.vz * dt;
        q.vy -= 7 * dt;
        q.vx *= 1 - 1.4 * dt;
        q.vz *= 1 - 1.4 * dt;
        if (q.y < 0) { q.y = 0; q.vy *= -0.2; }
      }
    }

    updateFlakes(dt, speedRatio) {
      for (const f of this.flakes) {
        f.y += dt * (0.05 + f.d * 0.12 + speedRatio * f.d * 1.1);
        f.drift += dt * 2;
        f.x += Math.sin(f.drift) * dt * 0.012 - this.p.vx * dt * 0.006 * f.d;
        if (f.y > 1.05) { f.y = -0.05; f.x = Math.random(); }
        if (f.x > 1.05) f.x -= 1.1; else if (f.x < -0.05) f.x += 1.1;
      }
    }

    popup(text, color, pts) {
      this.popups.push({ text, color: color || '#ffffff', pts: pts || 0, age: 0, life: 1.3, x: (Math.random() - 0.5) * 0.1 });
      if (this.popups.length > 6) this.popups.shift();
    }

    updatePopups(dt) {
      for (let i = this.popups.length - 1; i >= 0; i--) {
        const p = this.popups[i];
        p.age += dt;
        if (p.age >= p.life) this.popups.splice(i, 1);
      }
    }

    /* --- 描画 ---------------------------------------------------------- */
    render() {
      const r = this.r;
      const ctx = r.ctx;
      const { W, H } = r;
      const p = this.p;

      ctx.setTransform(r.dpr, 0, 0, r.dpr, 0, 0);
      r.setCamera(this.cam);

      // カメラロールは画面全体に掛け、隅が空かないよう少し拡大する
      ctx.save();
      const ra = Math.abs(this.cam.roll);
      const cover = Math.max(
        (W * Math.cos(ra) + H * Math.sin(ra)) / W,
        (H * Math.cos(ra) + W * Math.sin(ra)) / H
      ) + 0.004;
      ctx.translate(W / 2, H / 2);
      ctx.rotate(this.cam.roll);
      ctx.scale(cover, cover);
      ctx.translate(-W / 2, -H / 2);

      r.drawSky(this.world, this.t);
      r.drawWorld(this.world, this.t);
      r.drawTrail(this.trail);
      this.drawParticles(ctx, 'behind');
      this.drawRider(ctx);
      this.drawParticles(ctx, 'front');

      ctx.restore();

      const speedRatio = clamp((p.speed - 12) / 26, 0, 1);
      r.drawSnowfall(this.flakes, speedRatio);
      r.drawSpeedLines(speedRatio * 0.5 + (this.boostTime > 0 ? 0.7 : 0));
      r.drawVignette(speedRatio, this.boostTime > 0 ? 1 : 0);
      if (this.flashA > 0) r.flash(this.flashA * 0.6, this.flashColor);

      this.drawPopups(ctx);
      if (this.state === 'ready') this.drawCountdown(ctx);
    }

    riderScreen() {
      const p = this.p;
      const absX = SB.centerX(p.z) + p.x;
      const gy = SB.terrainY(p.z);
      const rider = this.r.project(absX, gy + p.y, p.z);
      const ground = this.r.project(absX, gy, p.z);
      return { rider, ground };
    }

    drawRider(ctx) {
      const p = this.p;
      const { rider, ground } = this.riderScreen();
      if (!rider) return;
      // 無敵時間中は点滅
      if (p.invuln > 0 && Math.floor(p.invuln * 12) % 2 === 0) return;
      const u = rider.s;
      SB.drawPlushie(ctx, rider.x, rider.y, u, {
        lean: p.lean,
        spin: p.spin,
        air: p.air,
        tuck: this.input.tuck && !p.air ? 1 : (p.air && p.grabbed > 0 ? 1 : 0),
        crash: p.crash > 0 ? 1 : 0,
        crashRot: p.crashRot,
        t: this.t,
        blink: p.blink,
        squash: p.squash,
        speedRatio: clamp((p.speed - 12) / 26, 0, 1),
        shadowY: ground ? ground.y - rider.y : 0,
      });
    }

    drawParticles(ctx, layer) {
      const r = this.r;
      const pz = this.p.z;
      for (const q of this.particles) {
        const isFront = q.z < pz;
        if ((layer === 'front') !== isFront) continue;
        const pr = r.project(SB.centerX(q.z) + q.x, SB.terrainY(q.z) + q.y, q.z);
        if (!pr || pr.dz < 3) continue;
        const a = 1 - q.age / q.life;
        if (q.kind === 'spark') {
          ctx.fillStyle = `rgba(255,222,140,${a})`;
          SB.drawStar(ctx, pr.x, pr.y, q.r * pr.s * 1.6);
        } else {
          ctx.fillStyle = `rgba(255,255,255,${0.85 * a})`;
          ctx.beginPath();
          ctx.arc(pr.x, pr.y, clamp(q.r * pr.s * (1 + q.age), 0.5, 13), 0, TAU);
          ctx.fill();
        }
      }
    }

    drawPopups(ctx) {
      const { W, H } = this.r;
      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      let i = 0;
      for (const p of this.popups) {
        const t = p.age / p.life;
        const a = t < 0.15 ? t / 0.15 : 1 - Math.max(0, (t - 0.6) / 0.4);
        const y = H * 0.40 - i * H * 0.055 - easeOutCubic(t) * H * 0.06;
        const size = Math.max(18, H * 0.038);
        ctx.globalAlpha = clamp(a, 0, 1);
        ctx.font = `900 ${size}px system-ui, sans-serif`;
        ctx.lineWidth = size * 0.18;
        ctx.strokeStyle = 'rgba(20,40,70,0.55)';
        ctx.fillStyle = p.color;
        const label = p.pts ? `${p.text}  +${fmt(p.pts)}` : p.text;
        ctx.strokeText(label, W * 0.5 + p.x * W, y);
        ctx.fillText(label, W * 0.5 + p.x * W, y);
        i++;
      }
      ctx.restore();
    }

    drawCountdown(ctx) {
      const { W, H } = this.r;
      const n = Math.ceil(this.readyTimer - 0.2);
      const label = n <= 0 ? 'GO!' : String(Math.min(3, n));
      const frac = 1 - ((this.readyTimer - 0.2) % 1);
      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const size = H * (0.12 + (1 - frac) * 0.03);
      ctx.font = `900 ${size}px system-ui, sans-serif`;
      ctx.globalAlpha = clamp(1 - Math.pow(frac, 3), 0.15, 1);
      ctx.lineWidth = size * 0.14;
      ctx.strokeStyle = 'rgba(20,40,70,0.5)';
      ctx.fillStyle = n <= 0 ? '#8fe0a0' : '#ffffff';
      ctx.strokeText(label, W / 2, H * 0.38);
      ctx.fillText(label, W / 2, H * 0.38);
      ctx.restore();
    }
  }

  SB.Game = Game;
  SB.CAM_BACK = CAM_BACK;
})(window);

/* ===== src/main.js ===== */
/* 起動と画面まわり ---------------------------------------------------------- */
(function (global) {
  'use strict';
  const SB = global.SB;
  const { fmt, clamp, store } = SB.util;

  const $ = (id) => document.getElementById(id);

  const els = {
    hud: $('hud'), score: $('score'), distance: $('distance'), speed: $('speed'),
    combo: $('combo'), hearts: $('hearts'), boostFill: $('boost-fill'),
    boostWrap: document.querySelector('.boost-wrap'),
    title: $('screen-title'), pause: $('screen-pause'), result: $('screen-result'),
    titleBest: $('title-best'),
    resultTitle: $('result-title'), resultScore: $('result-score'),
    resultDistance: $('result-distance'), resultBells: $('result-bells'),
    resultTricks: $('result-tricks'), resultBest: $('result-best'),
  };

  /* --- UI ------------------------------------------------------------ */
  const ui = {
    haptics: store.get('sb_haptics', '1') !== '0',
    sound: store.get('sb_sound', '1') !== '0',
    _lastCombo: 0,
    _lastHearts: -1,

    setScreen(name) {
      for (const key of ['title', 'pause', 'result']) {
        els[key].classList.toggle('hidden', key !== name);
      }
    },
    setHud(on) { els.hud.classList.toggle('hidden', !on); },

    updateHud(d) {
      els.score.textContent = fmt(d.score);
      els.distance.textContent = fmt(d.distance);
      els.speed.textContent = fmt(d.speed);

      if (d.combo !== this._lastCombo) {
        this._lastCombo = d.combo;
        els.combo.textContent = d.combo > 1 ? `${d.combo} COMBO` : '';
        els.combo.classList.toggle('show', d.combo > 1);
      }
      if (d.hearts !== this._lastHearts) {
        this._lastHearts = d.hearts;
        els.hearts.innerHTML = '';
        for (let i = 0; i < 3; i++) {
          const s = document.createElement('span');
          s.textContent = '🩵';
          if (i >= d.hearts) s.className = 'lost';
          els.hearts.appendChild(s);
        }
      }
      els.boostFill.style.width = `${clamp(d.boost, 0, 100)}%`;
      els.boostWrap.classList.toggle('ready', d.boost >= 50 || d.boosting);
    },

    showResult(r) {
      els.resultTitle.textContent = r.isBest ? 'ハイスコア！' : 'おつかれさま！';
      els.resultTitle.classList.toggle('new-best', r.isBest);
      els.resultScore.textContent = fmt(r.score);
      els.resultDistance.textContent = `${fmt(r.distance)} m`;
      els.resultBells.textContent = fmt(r.bells);
      els.resultTricks.textContent = fmt(r.tricks);
      els.resultBest.textContent = fmt(r.best);
      this.setScreen('result');
    },

    refreshTitleBest(game) {
      els.titleBest.textContent = game.best > 0
        ? `ベスト ${fmt(game.best)} 点 / ${fmt(game.bestDist)} m`
        : '';
    },
  };

  /* --- 生成 ---------------------------------------------------------- */
  const renderer = new SB.Renderer($('game'));
  const input = new SB.Input($('touch'));
  const game = new SB.Game(renderer, input, ui);
  SB.game = game;

  SB.audio.setEnabled(ui.sound);
  ui.refreshTitleBest(game);
  ui.setScreen('title');
  ui.setHud(false);

  /* --- ボタン -------------------------------------------------------- */
  const tap = (el, fn) => {
    if (!el) return;
    el.addEventListener('click', (e) => {
      e.preventDefault();
      SB.audio.resume();
      SB.audio.ui();
      fn();
    });
  };

  tap($('btn-start'), () => game.start());
  tap($('btn-retry'), () => game.start());
  tap($('btn-pause'), () => game.togglePause());
  tap($('btn-resume'), () => game.togglePause());
  tap($('btn-quit'), () => backToTitle());
  tap($('btn-title'), () => backToTitle());

  function backToTitle() {
    game.reset(true);
    game.state = 'title';
    ui.refreshTitleBest(game);
    ui.setScreen('title');
    ui.setHud(false);
  }

  const soundBtn = $('btn-sound');
  tap(soundBtn, () => {
    ui.sound = !ui.sound;
    store.set('sb_sound', ui.sound ? '1' : '0');
    soundBtn.classList.toggle('on', ui.sound);
    SB.audio.setEnabled(ui.sound);
  });
  soundBtn.classList.toggle('on', ui.sound);

  const hapticsBtn = $('btn-haptics');
  tap(hapticsBtn, () => {
    ui.haptics = !ui.haptics;
    store.set('sb_haptics', ui.haptics ? '1' : '0');
    hapticsBtn.classList.toggle('on', ui.haptics);
  });
  hapticsBtn.classList.toggle('on', ui.haptics);

  // Esc / P でポーズ、タイトルとリザルトでは Enter / Space で開始
  addEventListener('keydown', (e) => {
    if (e.code === 'Escape' || e.code === 'KeyP') {
      if (game.state === 'run' || game.state === 'paused') game.togglePause();
    }
    if ((e.code === 'Enter' || e.code === 'Space') && (game.state === 'title' || game.state === 'over')) {
      SB.audio.resume();
      game.start();
    }
  });

  // バックグラウンドに回ったら自動ポーズ
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && game.state === 'run') game.togglePause();
  });

  /* --- メインループ --------------------------------------------------- */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    game.update(dt);
    game.render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* --- 単一ファイル版では Service Worker を使わない --- */
})(window);

</script>
</body>
</html>
